<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080C18">
<title>Tarjeta de Valeria Hernández · GreenRack AI</title>
<style>
/* Para cambiar el color de fondo, edita --fondo (y --centro, el brillo suave del centro) */
:root{--fondo:#080C18;--centro:#141E38;--acento:#10B981}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 50% 40%,var(--centro),var(--fondo) 70%);
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:16px;
font-family:"Segoe UI",Helvetica,Arial,sans-serif}
img{width:100%;max-width:1050px;height:auto;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
a.btn{padding:11px 22px;border-radius:10px;background:var(--acento);color:#04120d;font-weight:600;font-size:15px;text-decoration:none}
</style>
</head>
<body>
<img src="tarjeta_valeria_hernandez.png" alt="Tarjeta de presentación de Valeria Hernández">
<a class="btn" href="tarjeta_valeria_hernandez.png" download="tarjeta_valeria_hernandez.png">Guardar tarjeta</a>
</body>
</html>
